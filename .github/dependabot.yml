# Keeps the pins honest: weekly pull requests for Python dependencies (requirements*.txt), the base image in the
# Dockerfile, the images in docker-compose.yml, and the GitHub Actions used by .github/workflows. Security advisories
# open pull requests regardless of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
