name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.2 is what this project ships; 4.2 is what LinkedEyeWebProject still runs (see docs/adr/0002)
        django: ["5.2", "4.2"]
    env:
      LINKEDEYE_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - if: matrix.django == '4.2'
        run: pip install "Django>=4.2,<5.0"
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --verbosity 2

  test-postgres:
    # the database docker-compose and the Kubernetes manifests deploy against
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkedeye
          POSTGRES_USER: linkedeye
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkedeye -d linkedeye"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LINKEDEYE_DEBUG: "true"
      LINKEDEYE_DB_ENGINE: django.db.backends.postgresql
      LINKEDEYE_DB_HOST: 127.0.0.1
      LINKEDEYE_DB_PORT: "5432"
      LINKEDEYE_DB_NAME: linkedeye
      LINKEDEYE_DB_USER: linkedeye
      LINKEDEYE_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # + the optional Pillow extra so the print-colour conversion tests run here, the optional redis client of the APM
      # module and the optional pyvmomi of the hypervisor module (the Django 4.2 / 5.2 jobs above run without them: the code
      # imports all three lazily)
      - run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-images.txt -r requirements-apm.txt -r requirements-vsphere.txt
      - name: Migrate (PostgreSQL)
        run: python manage.py migrate --noinput
      - name: Tests (PostgreSQL)
        run: python manage.py test --noinput --verbosity 1

  dependency-audit:
    # known-vulnerable releases inside the version ranges of requirements*.txt (docs/adr/0002 relies on this staying clean)
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit --strict -r requirements.txt -r requirements-postgres.txt -r requirements-images.txt -r requirements-apm.txt -r requirements-ssh.txt

  deploy-config:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml -r requirements.txt
      - name: Static checks (compose, Kubernetes, Prometheus, Alertmanager, docs)
        run: python deploy/validate.py
      - name: Bundle regression tests (gunicorn.conf.py, healthcheck.py, validate.py)
        run: python -m unittest discover -s deploy/tests -v
      - name: docker compose config
        run: |
          cp deploy/compose.env.example .env
          sed -i -e 's/^LINKEDEYE_SECRET_KEY=$/LINKEDEYE_SECRET_KEY=ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyzABCDEF/' \
                 -e 's/^LINKEDEYE_DB_PASSWORD=$/LINKEDEYE_DB_PASSWORD=ci-only-password/' \
                 -e 's/^LINKEDEYE_ALERTMANAGER_WEBHOOK_TOKEN=$/LINKEDEYE_ALERTMANAGER_WEBHOOK_TOKEN=ci-only-token-0123456789/' .env
          docker compose --profile observability config --quiet
          rm .env
      - name: promtool / amtool
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
          echo ci-token > "$RUNNER_TEMP/am-token"
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            -v "$RUNNER_TEMP/am-token:/run/secrets/alertmanager_webhook_token:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml

  live-stack:
    # deploy/live end to end: bootstrap.sh builds the image and starts caddy + web + worker + PostgreSQL in plain-HTTP mode
    # on a dummy domain, creates the administrator, runs go_live_check; then sign-in, backup, restore and update are exercised.
    # (The Let's Encrypt path needs a public DNS name and cannot run in CI; docs/GO_LIVE.md says what is and is not tested.)
    name: Live deployment pack (compose, plain HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINKEDEYE_ADMIN_PASSWORD: ci-only-Password-2026-xyz
    steps:
      - uses: actions/checkout@v7
      - name: Scripts parse and pass shellcheck
        run: |
          for f in deploy/live/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning deploy/live/*.sh
      - name: Dummy domain
        run: echo "127.0.0.1 linkedeye.test" | sudo tee -a /etc/hosts
      - name: bootstrap.sh (build, migrate, start, first administrator, go_live_check)
        run: ./deploy/live/bootstrap.sh --domain linkedeye.test --mode http --admin-email ci@example.org --yes
      - name: Same bootstrap again changes nothing (idempotent)
        run: |
          cp deploy/live/.env /tmp/env.before
          ./deploy/live/bootstrap.sh --yes
          diff /tmp/env.before deploy/live/.env
      - name: Health endpoint, sign-in page, static files through the proxy
        run: |
          curl -fsS http://linkedeye.test/healthz | grep -q '"status": "ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://linkedeye.test/accounts/login/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://linkedeye.test/static/linkedeye/app.css)" = 200
          ./deploy/live/healthcheck.sh
      - name: Sign in as the administrator
        run: |
          jar="$(mktemp)"
          curl -fsS -c "$jar" -o /tmp/login.html http://linkedeye.test/accounts/login/
          token="$(grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')"
          test -n "$token"
          code="$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -H 'Referer: http://linkedeye.test/accounts/login/' \
            --data-urlencode "csrfmiddlewaretoken=$token" --data-urlencode username=admin \
            --data-urlencode "password=$LINKEDEYE_ADMIN_PASSWORD" http://linkedeye.test/accounts/login/)"
          test "$code" = 302
          test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://linkedeye.test/)" = 200
      - name: go_live_check reports no FAIL
        run: docker compose -f deploy/live/docker-compose.live.yml exec -T web python manage.py go_live_check --url http://localhost:8000
      - name: Backup, then restore it
        run: |
          ./deploy/live/backup.sh
          ./deploy/live/restore.sh "$(ls -1 deploy/live/backups/linkedeye-*.tar | sort | tail -1)" --yes
      - name: update.sh (backup, migrate, restart)
        run: ./deploy/live/update.sh --no-pull --no-build --yes
      - name: Observability profile renders
        run: docker compose -f deploy/live/docker-compose.live.yml --profile observability config --quiet
      - name: Logs
        if: failure()
        run: docker compose -f deploy/live/docker-compose.live.yml logs --tail=200 || true
      - name: Clean up
        if: always()
        run: docker compose -f deploy/live/docker-compose.live.yml down -v || true

  docker:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            db_extras: "postgres"
          - name: postgres-mysql
            db_extras: "postgres mysql"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: linkedeye:ci
          build-args: |
            DB_EXTRAS=${{ matrix.db_extras }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=linkedeye-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=linkedeye-${{ matrix.name }}
      - name: Image runs as the non-root user
        run: test "$(docker run --rm linkedeye:ci id -u)" = "10001"
      - name: Image carries no legacy backend tree, secrets notes or docs
        run: |
          # .dockerignore keeps backend/ (SECRETS_AUDIT.md, Read.me, vault keys) and docs/ out; the two assets the
          # console reads from the legacy tree stay
          docker run --rm linkedeye:ci sh -c '
            ! test -e /app/backend/SECRETS_AUDIT.md && ! test -e /app/backend/Read.me && ! test -d /app/docs &&
            test -d /app/iframeGraphs && test -d /app/backend/template/DIRECT'
      - name: Database drivers
        run: |
          docker run --rm linkedeye:ci python -c "import psycopg; print('psycopg', psycopg.__version__)"
          if [ "${{ matrix.name }}" = "postgres-mysql" ]; then
            docker run --rm linkedeye:ci python -c "import MySQLdb; print('mysqlclient', MySQLdb.version_info)"
          fi
      - name: Deployment checks
        run: |
          docker run --rm -e LINKEDEYE_SECRET_KEY=ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyzABCDEF \
            -e LINKEDEYE_ALLOWED_HOSTS=linkedeye.example.com linkedeye:ci \
            python manage.py check --deploy --fail-level ERROR
      - name: Smoke test (gunicorn, HEALTHCHECK, static files)
        run: |
          docker run -d --name le-smoke -p 8000:8000 \
            -e LINKEDEYE_SECRET_KEY=ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyzABCDEF \
            -e LINKEDEYE_ALLOWED_HOSTS=localhost \
            -e LINKEDEYE_DB_NAME=/app/data/smoke.sqlite3 \
            linkedeye:ci sh -c 'python manage.py migrate --noinput && exec gunicorn --config /app/gunicorn.conf.py'
          status=starting
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' le-smoke)"
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' le-smoke)" = true ] || break
            sleep 5
          done
          docker logs le-smoke 2>&1 | tail -40
          test "$status" = healthy
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null -H 'Host: localhost' http://127.0.0.1:8000/static/linkedeye/app.css
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8000/accounts/login/)" = 200
      - name: Clean up
        if: always()
        run: docker rm -f le-smoke || true
