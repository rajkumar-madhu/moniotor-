<section class="backend-health" aria-labelledby="backend-health-title"
         data-backend-summary data-summary-url="{% url 'backend_summary_api' %}" data-site="{{ request.GET.site|default:'' }}">
  <div class="backend-health-head">
    <div><span class="backend-eyebrow">PROD ENV</span><h2 id="backend-health-title" data-summary-fetched>Legacy backend summary</h2></div>
    <span class="backend-connected" data-summary-status aria-live="polite">Loading status…</span>
  </div>
  <div class="backend-health-grid" data-summary-grid></div>
  <p class="backend-health-foot" data-summary-foot></p>
</section>
