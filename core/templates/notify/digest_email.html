<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#333;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f2f2;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e0e0e0;border-radius:8px;">
        <tr><td style="padding:16px 20px;background:#1f1f1f;color:#fff;font-size:18px;font-weight:600;">
          Linked<span style="color:#e99123;">Eye</span>
        </td></tr>
        <tr><td style="padding:20px;">
          <p style="margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#888;">{{ severity_label }} digest</p>
          <h1 style="margin:0 0 14px;font-size:18px;line-height:1.35;">{{ title }}</h1>
          <p style="margin:0 0 10px;font-size:14px;color:#555;">Notifications were collapsed into this summary to avoid a flood:</p>
          <ul style="margin:0;padding-left:20px;font-size:14px;line-height:1.5;color:#444;">
            {% for line in lines %}<li style="margin:4px 0;">{{ line }}</li>{% endfor %}
          </ul>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
