# OPTIONAL in-cluster PostgreSQL for the argus install. Skip this file when you have a managed or existing
# PostgreSQL: set LINKEDEYE_DB_HOST in configmap-patch.yaml instead.
#
# To use it, uncomment "- postgres.yaml" under resources in kustomization.yaml. It matches what the base
# manifests already expect: Service "postgres" in this namespace (LINKEDEYE_DB_HOST=postgres.fs-linkedeye.svc.cluster.local),
# pod label app.kubernetes.io/name=linkedeye-postgres (the NetworkPolicy "linkedeye-db-ingress" admits only the web,
# probes and migrate pods to it), and the password from Secret linkedeye-secrets (LINKEDEYE_DB_PASSWORD).
#
# A single replica on one PersistentVolume: fine to start, but it is not highly available. For production data keep
# backups (deploy/kubernetes/optional/backup-cronjob.yaml) and consider a database operator later.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/name: linkedeye-postgres
    app.kubernetes.io/part-of: linkedeye
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: linkedeye-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linkedeye-postgres
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/name: linkedeye-postgres
    app.kubernetes.io/part-of: linkedeye
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkedeye-postgres
        app.kubernetes.io/part-of: linkedeye
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # the postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: linkedeye
            - name: POSTGRES_DB
              value: linkedeye
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedeye-secrets
                  key: LINKEDEYE_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "linkedeye", "-d", "linkedeye"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "linkedeye", "-d", "linkedeye"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <REPLACE if the cluster has no default class: kubectl get storageclass>
        resources:
          requests:
            storage: 20Gi
