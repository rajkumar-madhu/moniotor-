# FinSpot DX DR (Lesites slug fs-dx-le) — portal host per administration/finspot_naming.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkedeye-config
  namespace: fs-linkedeye
data:
  LINKEDEYE_ALLOWED_HOSTS: "fs-le-dx.finspot.in,linkedeye-web,linkedeye-web.fs-linkedeye.svc,linkedeye-web.fs-linkedeye.svc.cluster.local"
  LINKEDEYE_CSRF_TRUSTED_ORIGINS: "https://fs-le-dx.finspot.in"
  # NSE/BSE lab networks (SSRF allowlist for probes). NOT 172.16.0.0/16: the cluster's own API server (172.16.0.70:8443,
  # kubeconfig.example.yaml) and its nodes live there, and every listed address can be reached by anyone who may configure
  # a probe. To monitor hosts in that network, add only their own narrow subnets or /32s, never the control plane's.
  LINKEDEYE_PROBE_ALLOWED_PRIVATE_CIDRS: "10.10.0.0/16,10.20.0.0/16"
