# Copy to a path outside the repo (e.g. ~/.kube/finspot-dev-config), fill credentials from
# the bastion fs-dev-cp-ps, chmod 600, and export KUBECONFIG. Never commit real cert/key data.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority-data: <REPLACE_BASE64_CLUSTER_CA>
      server: https://172.16.0.70:8443
    name: kubernetes
contexts:
  - context:
      cluster: kubernetes
      user: kubernetes-admin
    name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
users:
  - name: kubernetes-admin
    user:
      client-certificate-data: <REPLACE_BASE64_CLIENT_CERT>
      client-key-data: <REPLACE_BASE64_CLIENT_KEY>
