# Laptop workflow: FortiClient VPN + SSH tunnel 18443 -> 172.16.0.70:8443 (see ssh-config.example).
# Copy to ~/.kube/finspot-dev-tunnel-config, merge in client cert/key from the bastion, chmod 600.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority-data: <REPLACE_BASE64_CLUSTER_CA>
      server: https://127.0.0.1:18443
    name: kubernetes
contexts:
  - context:
      cluster: kubernetes
      user: kubernetes-admin
    name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
users:
  - name: kubernetes-admin
    user:
      client-certificate-data: <REPLACE_BASE64_CLIENT_CERT>
      client-key-data: <REPLACE_BASE64_CLIENT_KEY>
