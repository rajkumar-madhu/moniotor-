# FinSpot dev cluster overlay (kubectl context from fs-dev-cp-ps bastion).
# Schedules web, probes, migrate, and Postgres on worker fs-dev1-le
# (172.16.0.74, fs-le-dev1.finspot.in).
# Does not include secrets or kube credentials — see docs/FINSPOT_DEV_K8S.md.
#
#   kubectl apply -k deploy/overlays/finspot-dev
#
# Still required before apply: linkedeye-secrets, container image push to Harbor, TLS secret
# finspot-wildcard-tls in fs-linkedeye.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes
  - postgres.yaml

patches:
  - path: configmap-patch.yaml
  - path: node-placement.yaml
  - path: web-replicas.yaml
  - path: ingress-patch.yaml
  - path: serviceaccount-patch.yaml
  # ingress-nginx on fs-dev-cs-tool1 is hostNetwork. Calico VXLAN sends
  # that traffic from the node's tunnel address, not from the controller pod
  # or from 172.16.0.77, so the pod selector never matches.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: linkedeye-web-ingress
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 192.168.155.55/32

images:
  - name: registry.example.com/linkedeye
    newName: harbor.finspot.in/linkedeye/linkedeye
    newTag: "9.4"
